services:
  - type: web
    name: sat-scheduler
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    envVars:
      - key: SAT_SCHEDULER_ENV
        value: production
      - key: SAT_SCHEDULER_SESSION_SECRET
        generateValue: true
      - key: SAT_SCHEDULER_HTTPS_ONLY
        value: "1"
      - key: SAT_SCHEDULER_LOG_LEVEL
        value: INFO
      - key: SAT_SCHEDULER_DB_ENGINE
        value: postgresql
      - key: SAT_SCHEDULER_DATABASE_URL
        fromDatabase:
          name: sat-scheduler-db
          property: connectionString
      - key: SAT_SCHEDULER_DB_CONNECT_TIMEOUT
        value: "10"

databases:
  - name: sat-scheduler-db
    databaseName: sat_scheduler
    user: sat_scheduler
    plan: free
    region: singapore
    ipAllowList: []
